# Applied by a cluster admin before GitHub Actions helm-upgrades the foundry-on-aks chart.
# Dev writes only foundry-sessions-dev. Prod writes only foundry-sessions.
# The deploy identities cannot create namespaces. Restricted admission rejects a pod that
# asks for root, host namespaces, or extra capabilities, including a pod created outside this chart.
apiVersion: v1
kind: Namespace
metadata:
  name: foundry-sessions-dev
  labels:
    app.kubernetes.io/name: foundry-on-aks
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: foundry-sessions
  labels:
    app.kubernetes.io/name: foundry-on-aks
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
