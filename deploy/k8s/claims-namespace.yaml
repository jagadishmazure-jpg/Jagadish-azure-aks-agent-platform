# Applied by a cluster admin before GitHub Actions helm-upgrades.
# Dev writes only claims-dev. Prod writes only claims. Neither identity can create a namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: claims-dev
  labels:
    app.kubernetes.io/name: claims-agent
---
apiVersion: v1
kind: Namespace
metadata:
  name: claims
  labels:
    app.kubernetes.io/name: claims-agent
