# Values for the Jenkins Helm chart (https://charts.jenkins.io, chart jenkins/jenkins).
# Pin checked by CI: 5.13.3. Install into namespace jenkins AFTER deploy/helm/jenkins-aks
# has created the service accounts and the Key Vault sync pod has materialized
# secret jenkins-keyvault. See docs/deploy.md.
#
#   helm repo add jenkins https://charts.jenkins.io
#   helm upgrade --install jenkins jenkins/jenkins \
#     --namespace jenkins --version 5.13.3 -f deploy/jenkins/values.yaml
#
# No secret values belong in this file. The admin user and password are keys in
# the Kubernetes secret the CSI driver syncs from Key Vault. ACR and AKS access
# for release pods is the jenkins-release workload identity, not a registry password.
# Client ids are set on the service accounts in the jenkins-aks chart.

fullnameOverride: jenkins

rbac:
  create: true
  readSecrets: false

serviceAccount:
  create: false
  name: jenkins

# jenkins-release, not jenkins-agent: the chart names its JNLP Service jenkins-agent.
serviceAccountAgent:
  create: false
  name: jenkins-release

controller:
  admin:
    createSecret: false
    existingSecret: jenkins-keyvault
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password
  # Builds run on Kubernetes agents, not on the controller.
  numExecutors: 0
  executorMode: EXCLUSIVE
  podLabels:
    app.kubernetes.io/name: jenkins
  ingress:
    enabled: false
  # defaultConfig must stay true or agent.podTemplates is ignored.
  JCasC:
    defaultConfig: true

# The chart's default installPlugins already include kubernetes, workflow-aggregator,
# git and configuration-as-code. Leave that list in place so pod templates load.

agent:
  enabled: true
  namespace: jenkins
  # Unlabelled work lands on the CI account, which has no Azure roles.
  serviceAccount: jenkins-ci
  podLabels:
    app.kubernetes.io/name: jenkins-agent
  podTemplates:
    # Lint, pytest and the eval gate. No workload-identity label, no cloud token.
    python: |
      - name: python
        label: python
        serviceAccount: jenkins-ci
        yamlMergeStrategy: merge
        yaml: |-
          spec:
            serviceAccountName: jenkins-ci
        containers:
          - name: python
            image: python:3.12-slim
            command: "/bin/sh -c"
            args: "cat"
            ttyEnabled: true
            privileged: false
            resourceRequestCpu: "200m"
            resourceRequestMemory: "512Mi"
            resourceLimitCpu: "1"
            resourceLimitMemory: "1Gi"
          - name: helm
            image: alpine/helm:3.16.2
            command: "/bin/sh -c"
            args: "cat"
            ttyEnabled: true
            privileged: false
            resourceRequestCpu: "100m"
            resourceRequestMemory: "128Mi"
            resourceLimitCpu: "500m"
            resourceLimitMemory: "256Mi"
          - name: terraform
            image: hashicorp/terraform:1.9.8
            command: "/bin/sh -c"
            args: "cat"
            ttyEnabled: true
            privileged: false
            resourceRequestCpu: "100m"
            resourceRequestMemory: "256Mi"
            resourceLimitCpu: "500m"
            resourceLimitMemory: "512Mi"
    # Docker build, ACR push, helm upgrade. Only scheduled when DEPLOY_TO_AKS is true.
    # dind is privileged so `docker build` has a daemon. It is not the claims-agent
    # runtime. The deploy container uses the jenkins-release service account; the
    # workload identity webhook injects AZURE_CLIENT_ID, AZURE_TENANT_ID and
    # AZURE_FEDERATED_TOKEN_FILE. Those are how az login reaches ACR and AKS.
    release: |
      - name: release
        label: release
        serviceAccount: jenkins-release
        yamlMergeStrategy: merge
        yaml: |-
          metadata:
            labels:
              azure.workload.identity/use: "true"
          spec:
            serviceAccountName: jenkins-release
        containers:
          - name: deploy
            image: mcr.microsoft.com/azure-cli:2.67.0
            command: "/bin/sh -c"
            args: "cat"
            ttyEnabled: true
            privileged: false
            envVars:
              - envVar:
                  key: DOCKER_HOST
                  value: tcp://127.0.0.1:2375
            resourceRequestCpu: "200m"
            resourceRequestMemory: "512Mi"
            resourceLimitCpu: "1"
            resourceLimitMemory: "2Gi"
          - name: dind
            image: docker:27.4.1-dind
            privileged: true
            envVars:
              - envVar:
                  key: DOCKER_TLS_CERTDIR
                  value: ""
            resourceRequestCpu: "200m"
            resourceRequestMemory: "512Mi"
            resourceLimitCpu: "1"
            resourceLimitMemory: "2Gi"

persistence:
  enabled: true
  # The controller also mounts the CSI volume so secret rotation keeps the
  # files current. The secret itself is created by the jenkins-keyvault-sync
  # pod in the jenkins-aks chart before this release is installed.
  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: jenkins-keyvault
  mounts:
    - name: secrets-store
      mountPath: /mnt/secrets-store
      readOnly: true
