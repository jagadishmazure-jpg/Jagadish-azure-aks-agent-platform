apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: jenkins-keyvault
  labels:
    app.kubernetes.io/name: jenkins
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.secretNames.adminUser }}
          objectType: secret
        - |
          objectName: {{ .Values.secretNames.adminPassword }}
          objectType: secret
  secretObjects:
    - secretName: jenkins-keyvault
      type: Opaque
      data:
        - objectName: {{ .Values.secretNames.adminUser }}
          key: jenkins-admin-user
        - objectName: {{ .Values.secretNames.adminPassword }}
          key: jenkins-admin-password
