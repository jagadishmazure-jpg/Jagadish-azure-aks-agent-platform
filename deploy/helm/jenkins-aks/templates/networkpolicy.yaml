# The release agent runs a privileged dind sidecar. It accepts no inbound
# connections. dockerd is bound to 127.0.0.1 inside the pod; this policy keeps
# every other pod from opening a connection to it as well.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-release
  labels:
    app.kubernetes.io/name: jenkins-release
spec:
  podSelector:
    matchLabels:
      jenkins.io/release: "true"
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 50000, protocol: TCP }
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
        - { port: 443, protocol: TCP }
