apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    azure.workload.identity/use: "true"
  {{- if .Values.workloadIdentity.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-release
  labels:
    app.kubernetes.io/name: jenkins-release
    azure.workload.identity/use: "true"
  {{- if .Values.workloadIdentity.agentClientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.agentClientId | quote }}
  {{- end }}
---
# Lint, pytest and the eval gate. No federated credential and no Azure role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-ci
  labels:
    app.kubernetes.io/name: jenkins-ci
automountServiceAccountToken: false
