# Mounts the CSI volume so the driver creates secret jenkins-keyvault before the
# Jenkins chart starts. The chart reads that secret by name. Installing both at
# once races: the controller wants the secret before its own mount can create it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-keyvault-sync
  labels:
    app.kubernetes.io/name: jenkins-keyvault-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins-keyvault-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-keyvault-sync
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: jenkins
      automountServiceAccountToken: true
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: jenkins-keyvault
