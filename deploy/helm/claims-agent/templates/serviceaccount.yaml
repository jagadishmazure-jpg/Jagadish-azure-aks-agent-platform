apiVersion: v1
kind: ServiceAccount
metadata:
  name: claims-agent
  labels: {{- include "ca.labels" . | nindent 4 }}
  {{- if .Values.workloadIdentity.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
  {{- end }}
automountServiceAccountToken: {{ if .Values.workloadIdentity.clientId }}true{{ else }}false{{ end }}
