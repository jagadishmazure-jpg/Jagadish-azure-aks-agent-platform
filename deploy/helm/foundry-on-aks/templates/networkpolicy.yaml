# Namespace default deny. Later policies add the only allows: DNS for sessions, and
# session pods to the model Service port. Session pods have no ingress allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
  labels: {{- include "foa.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-ingress
  namespace: {{ .Release.Namespace }}
  labels: {{- include "foa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "foa.modelSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: foundry-on-aks
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/component: session
      ports: [{ port: 8080, protocol: TCP }]
{{- range .Values.sessions }}
---
# Egress for this session only: cluster DNS, and the model pod on 8080.
# There is no path to another session pod or to the claims namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-{{ .id }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "foa.labels" $ | nindent 4 }}
    northfield.example/session-id: {{ .id | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: session
      northfield.example/session-id: {{ .id | quote }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: foundry-on-aks
              app.kubernetes.io/instance: {{ $.Release.Name | quote }}
              app.kubernetes.io/component: model
      ports: [{ port: 8080, protocol: TCP }]
{{- end }}
