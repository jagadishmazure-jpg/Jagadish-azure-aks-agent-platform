apiVersion: v1
kind: ResourceQuota
metadata:
  name: foundry-sessions
  namespace: {{ .Release.Namespace }}
  labels: {{- include "foa.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory | quote }}
    limits.cpu: {{ .Values.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.quota.limitsMemory | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: foundry-sessions
  namespace: {{ .Release.Namespace }}
  labels: {{- include "foa.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
