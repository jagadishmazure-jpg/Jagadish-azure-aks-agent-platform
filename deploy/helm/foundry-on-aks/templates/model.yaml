apiVersion: v1
kind: ConfigMap
metadata:
  name: open-weight-model
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foa.labels" . | nindent 4 }}
    app.kubernetes.io/component: model
data:
  mock_model.py: |
{{ .Files.Get "files/mock_model.py" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: open-weight-model
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foa.labels" . | nindent 4 }}
    app.kubernetes.io/component: model
spec:
  type: ClusterIP
  selector: {{- include "foa.modelSelector" . | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-weight-model
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foa.labels" . | nindent 4 }}
    app.kubernetes.io/component: model
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "foa.modelSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "foa.modelSelector" . | nindent 8 }}
        {{- if .Values.model.workloadIdentity.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        checksum/mock: {{ .Files.Get "files/mock_model.py" | sha256sum | quote }}
    spec:
      serviceAccountName: open-weight-model
      automountServiceAccountToken: {{ if .Values.model.workloadIdentity.clientId }}true{{ else }}false{{ end }}
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      {{- if .Values.model.gpu.enabled }}
      nodeSelector:
        workload: open-weight-model
      tolerations:
        - { key: sku, operator: Equal, value: gpu, effect: NoSchedule }
      {{- end }}
      containers:
        - name: model
          image: {{ include "foa.image" .Values.model.image | quote }}
          imagePullPolicy: {{ .Values.model.image.pullPolicy }}
          command: ["python", "/config/mock_model.py"]
          ports: [{ containerPort: 8080, name: http }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: PORT, value: "8080" }
            - { name: MODEL_ID, value: {{ .Values.model.modelId | quote }} }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: HOME, value: /tmp }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: {{- toYaml .Values.model.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.model.resources.limits | nindent 14 }}
              {{- if .Values.model.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.model.gpu.count | quote }}
              {{- end }}
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: open-weight-model }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
