apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-weight-model
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foa.labels" . | nindent 4 }}
    app.kubernetes.io/component: model
  {{- if .Values.model.workloadIdentity.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.model.workloadIdentity.clientId | quote }}
  {{- end }}
automountServiceAccountToken: {{ if .Values.model.workloadIdentity.clientId }}true{{ else }}false{{ end }}
---
# Session pods share one identity with no Azure role. They do not mount an API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foa.labels" . | nindent 4 }}
    app.kubernetes.io/component: session
  {{- if .Values.session.workloadIdentity.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.session.workloadIdentity.clientId | quote }}
  {{- end }}
automountServiceAccountToken: false
