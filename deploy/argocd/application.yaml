# Optional GitOps alternative to .github/workflows/cd.yml. Not applied by CI.
# There is no automated sync: GitHub Actions is the default deployer, and an
# auto-sync here would put this git revision back over a helm upgrade.
# Apply this only after the CD workflow is disabled.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claims-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jagadishmazure-jpg/Jagadish-azure-aks-agent-platform.git
    targetRevision: main
    path: deploy/helm/claims-agent
    helm:
      valueFiles: [values.yaml]
      parameters:
        - { name: checkpoints.storageClass, value: azurefile-csi }
        - { name: env, value: prod }
  destination: { server: https://kubernetes.default.svc, namespace: claims }
  syncPolicy:
    syncOptions: [CreateNamespace=true]
