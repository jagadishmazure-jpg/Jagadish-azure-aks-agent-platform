# Build the image, scan it with Trivy (fail on HIGH/CRITICAL fixable), smoke-test it on kind
# (deploy, pod kill, resume), and on main push sign it keyless with cosign (GitHub OIDC, no keys).
name: container
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build-scan-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: docker build -t claims-agent:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: claims-agent:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.16.2 }
      - name: kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with: { cluster_name: nf-claims, config: deploy/kind/kind-config.yaml }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Smoke test (submit, kill pod, resume on new pod, same trace id)
        env: { KIND_CLUSTER: nf-claims }
        run: ./deploy/kind/smoke.sh
  sign:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-scan-kind
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build and push to GHCR (free for public repos)
        id: push
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}/claims-agent
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMG:${GITHUB_SHA}" .
          docker push "$IMG:${GITHUB_SHA}"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG:${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"
      - name: Keyless sign and verify
        run: |
          cosign sign --yes "${{ steps.push.outputs.digest }}"
          cosign verify "${{ steps.push.outputs.digest }}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
